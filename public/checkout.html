<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Seva Offering | Sri Seva Trust</title>
  <meta name="description" content="Secure UPI Dakshina checkout and offering confirmation.">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>">
  <style>
    .checkout-page-container {
      max-width: 620px;
      margin: 40px auto 80px auto;
      padding: 0 16px;
    }
    .checkout-card {
      background: var(--bg-surface);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-lg);
      padding: 30px 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .back-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-gold);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
      transition: all 0.2s ease;
    }
    .back-nav-btn:hover {
      transform: translateX(-4px);
      color: #fff;
    }
    .service-banner {
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .service-banner .title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }
    .service-banner .category {
      font-size: 12px;
      color: var(--text-muted);
    }
    .service-banner .price {
      font-family: var(--font-heading);
      font-size: 26px;
      font-weight: 800;
      color: var(--accent-gold);
      text-align: right;
    }
    .step-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 26px;
      font-size: 13px;
      font-weight: 600;
    }
    .step-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
    }
    .step-pill.active {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
    }
    .step-arrow {
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="bg-glow-top"></div>
  <div class="bg-glow-bottom"></div>

  <div class="checkout-page-container">
    <a href="/" class="back-nav-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span>Back to All Sacred Sevas</span>
    </a>

    <div class="step-indicator">
      <div class="step-pill active" id="pillStep1">
        <span>1</span> Devotee Details
      </div>
      <span class="step-arrow">&rarr;</span>
      <div class="step-pill" id="pillStep2">
        <span>2</span> UPI Payment
      </div>
      <span class="step-arrow">&rarr;</span>
      <div class="step-pill" id="pillStep3">
        <span>3</span> Receipt
      </div>
    </div>

    <div class="checkout-card" id="checkoutCard">
      <!-- Loading State -->
      <div id="checkoutLoading" style="text-align: center; padding: 40px; color: var(--text-muted);">
        <div style="font-size: 32px; margin-bottom: 12px;">🪔</div>
        <div>Loading your sacred offering details...</div>
      </div>

      <!-- Main Step Views Rendered Dynamically -->
      <div id="checkoutContent" style="display: none;"></div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/checkout.js"></script>
</body>
</html>
